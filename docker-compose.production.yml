services:
  app:
    environment:
      VIRTUAL_HOST: "${VIRTUAL_HOST:-hearth.sureka.family}"
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: "${LETSENCRYPT_HOST:-hearth.sureka.family}"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}"
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: "${PROXY_NETWORK:-net}"
